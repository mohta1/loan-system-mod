name: CI
on: { pull_request: { branches: [main] } }
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory TestResults
      - run: python -m unittest scripts/tests/test_check_backend_coverage.py
      - run: python scripts/check_backend_coverage.py --base-ref origin/${{ github.base_ref }} "TestResults/**/coverage.cobertura.xml"
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: TestResults/**/coverage.cobertura.xml }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/loan-system-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/loan-system-web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8080/health/ready && curl --fail http://localhost:5173/ && curl --fail http://localhost:5173/api/v1/system/info
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/loan-system-web/package-lock.json }
      - working-directory: frontend/loan-system-web
        run: npm ci && npx playwright install --with-deps chromium && npm run e2e
      - if: always()
        name: Capture Docker health diagnostics
        run: |
          for SERVICE in sqlserver api web; do
            CONTAINER="$(docker compose ps -q "$SERVICE")"
            echo "===== $SERVICE health ====="
            if [ -n "$CONTAINER" ]; then
              docker inspect "$CONTAINER" --format '{{json .State.Health}}' || true
            else
              echo "No container found for $SERVICE"
            fi
          done
          docker compose ps || true
          docker compose logs || true
      - if: always()
        run: docker compose down
